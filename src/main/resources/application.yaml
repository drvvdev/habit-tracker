

spring:
  application:
    name: habit-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/habit_tracker
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8080

logging:
  level:
    root: INFO
